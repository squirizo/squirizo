<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUIRIZO Reviews</title>
    <style>
        body { background: #fffaf5; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .review-form { background: white; padding: 25px; border-radius: 20px; max-width: 500px; margin: 20px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; margin: 10px 0; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #ff6600; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .review-item { background: white; padding: 15px; border-radius: 15px; margin: 15px auto; max-width: 500px; border-left: 5px solid #ff6600; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="review-form">
    <h2>Leave a Review</h2>
    <input type="text" id="name" placeholder="Enter Your Name">
    <textarea id="text" placeholder="Write your review here..." rows="3"></textarea>
    <button onclick="addReview()">Submit Review</button>
</div>

<div id="display"></div>

<script>
function addReview() {
    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;
    
    if(!name || !text) return alert("Please fill in the fields.");

    // Gagawa tayo ng object para sa review
    const review = { name, text };
    
    // I-save sa display nang direkta (Temporary lang para sa presentation)
    const display = document.getElementById("display");
    const div = document.createElement("div");
    div.className = "review-item";
    div.innerHTML = `<strong>${name}</strong><p>${text}</p>`;
    display.prepend(div);
    
    // Clear inputs
    document.getElementById("name").value = "";
    document.getElementById("text").value = "";
    alert("Review submitted!");
}
</script>
</body>
</html>
