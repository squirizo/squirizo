nerHTML = "No reviews yet."; return; } let reviews = JSON.parse(textData); container.innerHTML = ""; reviews.forEach(function(review){ let firstLetter = review.name.charAt(0).toUpperCase(); let imageHTML = ""; if(review.image){ imageHTML = <img src="${review.image}" class="review-img-display"> ; } container.innerHTML += <div class="review-item"> <div class="review-profile"> ${firstLetter} </div> <div class="review-content"> <div class="review-top"> <div class="review-name">${review.name}</div> <div class="review-stars">${review.rating}</div> </div> <div class="review-text"> ${review.text} </div> ${imageHTML} </div> </div> ; }); }catch(error){ console.error(error); container.innerHTML = "Failed to load reviews."; } } </script> </body> </html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQUIRIZO Reviews</title>

<link rel="stylesheet" href="css.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(135deg, #fff6ef, #fbe4d5);
    min-height:100vh;
}

header{
    background: linear-gradient(90deg, #7b4b32, #a15c38);
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    font-size:45px;
}

.back-btn{
    display:inline-block;
    margin:25px;
    padding:12px 20px;
    background:#ff6600;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.review-form{
    background:white;
    width:90%;
    max-width:550px;
    margin:auto;
    padding:35px;
    border-radius:20px;
}

.review-form h2{
    text-align:center;
    margin-bottom:20px;
}

.review-form input,
.review-form textarea{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

.review-form button{
    width:100%;
    padding:15px;
    border:none;
    background:#ff6600;
    color:white;
    border-radius:10px;
    cursor:pointer;
}

.star-rating{
    text-align:center;
    margin:15px 0;
}

.star-rating span{
    font-size:40px;
    cursor:pointer;
    color:#ccc;
}

.reviews-list{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.review-item{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

.review-stars{
    color:gold;
    margin-bottom:10px;
}

.review-name{
    font-weight:bold;
    margin-bottom:10px;
}

.review-img-display{
    max-width:100%;
    margin-top:10px;
    border-radius:10px;
}

</style>
</head>

<body>

<header>
    <h1>SQUIRIZO REVIEWS</h1>
</header>

<a href="index.html" class="back-btn">
← Back to Home
</a>

<div class="review-form">

    <h2>Leave a Review</h2>

    <input type="text" id="reviewName" placeholder="Enter Your Name">

    <div class="star-rating">

        <span onclick="setRating(1)">★</span>
        <span onclick="setRating(2)">★</span>
        <span onclick="setRating(3)">★</span>
        <span onclick="setRating(4)">★</span>
        <span onclick="setRating(5)">★</span>

    </div>

    <input type="hidden" id="reviewRating">

    <textarea id="reviewText" rows="5" placeholder="Write your review here..."></textarea>

    <input type="file" id="reviewImage" accept="image/*">

    <button onclick="addReview()" id="submitBtn">
        Submit Review
    </button>

</div>

<div class="reviews-list" id="reviewsContainer">

</div>

<script>

const BUCKET_ID = "BYz7cfcbgzkiw4pGvGfdpg";

const API_URL = `https://kvdb.io/${BUCKET_ID}/squirizo_live_data`;

window.onload = function(){

    displayReviews();
};

function setRating(value){

    document.getElementById("reviewRating").value = value;

    let stars = document.querySelectorAll(".star-rating span");

    stars.forEach((star,index)=>{

        if(index < value){

            star.style.color = "gold";

        }else{

            star.style.color = "#ccc";
        }
    });
}

function compressImage(file){

    return new Promise((resolve)=>{

        const reader = new FileReader();

        reader.readAsDataURL(file);

        reader.onload = function(event){

            const img = new Image();

            img.src = event.target.result;

            img.onload = function(){

                const canvas = document.createElement("canvas");

                const MAX_WIDTH = 250;

                const scale = MAX_WIDTH / img.width;

                canvas.width = MAX_WIDTH;

                canvas.height = img.height * scale;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img,0,0,canvas.width,canvas.height);

                resolve(canvas.toDataURL("image/jpeg",0.5));
            };
        };
    });
}

await fetch(API_URL,{

    method:"POST",

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify(reviews)
});

alert("Review submitted!");

displayReviews();
async function displayReviews(){

    const container = document.getElementById("reviewsContainer");

    try{

        const response = await fetch(API_URL);

        const data = await response.text();

        if(!data.startsWith("[")){

            container.innerHTML = "";

            return;
        }

        const reviews = JSON.parse(data);

        container.innerHTML = "";

        reviews.forEach(review=>{

            let imageHTML = "";

            if(review.image){

                imageHTML = `
                <img src="${review.image}" class="review-img-display">
                `;
            }

            container.innerHTML += `

            <div class="review-item">

                <div class="review-name">
                    ${review.name}
                </div>

                <div class="review-stars">
                    ${review.rating}
                </div>

                <div>
                    ${review.text}
                </div>

                ${imageHTML}

            </div>
            `;
        });

    }catch(error){

        console.log(error);
    }
}

</script>

</body>
</html>
