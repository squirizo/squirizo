<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SQUIRIZO Reviews</title>
    <style>
        body { font-family: sans-serif; background: #fbe4d5; padding: 20px; }
        .review-item { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="review-form">
    <input type="text" id="name" placeholder="Name">
    <textarea id="text" placeholder="Review"></textarea>
    <input type="file" id="image">
    <button onclick="saveReview()" id="btn">Submit</button>
</div>

<div id="display">Loading...</div>

<script>
// --- PALITAN MO ITO NG API URL MULA SA SHEETDB.IO ---
const API_URL = "https://sheetdb.io/api/v1/zxmdtvlmdyb9u"; 

async function saveReview() {
    const btn = document.getElementById("btn");
    btn.disabled = true; btn.innerText = "Saving...";

    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;
    const file = document.getElementById("image").files[0];
    
    let imageBase64 = "";
    if (file) {
        imageBase64 = await new Promise(r => { let reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
    }

    try {
        await fetch(API_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ data: [{ name: name, rating: "5", text: text, image: imageBase64 }] })
        });
        alert("Success!");
        location.reload();
    } catch(e) {
        alert("Error! Check console.");
    }
}

async function loadReviews() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        document.getElementById("display").innerHTML = data.map(r => `
            <div class="review-item">
                <strong>${r.name}</strong><p>${r.text}</p>
                ${r.image ? `<img src="${r.image}" width="100">` : ""}
            </div>
        `).join("");
    } catch(e) { document.getElementById("display").innerHTML = "No reviews yet."; }
}
loadReviews();
</script>
</body>
</html>
