<script>
// UPDATED: Ang tamang URL ng local system backend mo sa XAMPP folder mo
const API_URL = "http://localhost/entrep/reviews_api.php"; 

window.onload = function(){
    displayReviews();
}

// ADD REVIEW PROCESSOR
function addReview(){
    let name = document.getElementById("reviewName").value.trim();
    let rating = document.getElementById("reviewRating").value;
    let text = document.getElementById("reviewText").value.trim();
    let imageInput = document.getElementById("reviewImage");
    let file = imageInput.files[0];
    let submitBtn = document.getElementById("submitBtn");

    if(name === "" || rating === "" || text === ""){
        alert("Please fill up all fields!");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = "Submitting Review...";

    if(file){
        let reader = new FileReader();
        reader.onload = function(e){
            saveReviewToMySQL(name, rating, text, e.target.result);
        };
        reader.readAsDataURL(file);
    }else{
        saveReviewToMySQL(name, rating, text, "");
    }
}

// SAVE DATA TO MYSQL VIA PHP
async function saveReviewToMySQL(name, rating, text, image){
    let submitBtn = document.getElementById("submitBtn");

    try {
        let response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                rating: rating,
                text: text,
                image: image
            })
        });

        let result = await response.json();

        if(result.status === "success"){
            alert("Thank you! Your review has been saved to the MySQL database. ❤️");
            
            document.getElementById("reviewName").value = "";
            document.getElementById("reviewRating").value = "";
            document.getElementById("reviewText").value = "";
            document.getElementById("reviewImage").value = "";
            
            let stars = document.querySelectorAll(".star-rating span");
            stars.forEach(star => star.classList.remove("active"));
            
            displayReviews();
        } else {
            alert("Failed to save review to database.");
        }
    } catch (error) {
        console.error("Database Error:", error);
        alert("Could not connect to the local server.");
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Submit Review";
    }
}

// FETCH AND DISPLAY REVIEWS FROM MYSQL
async function displayReviews(){
    let container = document.getElementById("reviewsContainer");

    try {
        let response = await fetch(API_URL);
        if(!response.ok) throw new Error("Fetch failed");

        let reviews = await response.json();
        container.innerHTML = "";

        if(reviews.length === 0){
            container.innerHTML = '<p class="loading-text">No reviews yet. Be the first to leave one!</p>';
            return;
        }

        reviews.forEach(function(review){
            let firstLetter = review.name ? review.name.charAt(0).toUpperCase() : "U";

            container.innerHTML += `
            <div class="review-item">
                <div class="review-profile">${firstLetter}</div>
                <div class="review-content">
                    <div class="review-top">
                        <div class="review-name">${review.name}</div>
                        <div class="review-stars">${review.rating}</div>
                    </div>
                    <div class="review-text">${review.text}</div>
                    ${review.image ? `<img src="${review.image}" class="review-image">` : ""}
                </div>
            </div>
            `;
        });
    } catch (error) {
        console.error("Display Error:", error);
        container.innerHTML = '<p class="loading-text" style="color:red;">Error loading reviews from database.</p>';
    }
}

// STAR RATING ANIMATION HANDLER
function setRating(rating){
    document.getElementById("reviewRating").value = rating;
    let stars = document.querySelectorAll(".star-rating span");

    stars.forEach((star, index) => {
        if(index < rating.length){
            star.classList.add("active");
        }else{
            star.classList.remove("active");
        }
    });
}
</script>
