<script>

const BUCKET_ID = "BYz7cfcbgzkiw4pGvGfdpg";
const API_URL = `https://kvdb.io/${BUCKET_ID}/squirizo_live_data`;

window.onload = () => {
    displayReviews();
};

// STAR RATING
function setRating(ratingValue){

    document.getElementById("reviewRating").value = ratingValue;

    let stars = document.querySelectorAll(".star-rating span");

    stars.forEach((star, index) => {

        if(index < ratingValue){

            star.style.color = "gold";

        }else{

            star.style.color = "#ccc";
        }
    });
}

// IMAGE COMPRESS
function compressImage(file){

    return new Promise((resolve) => {

        const reader = new FileReader();

        reader.readAsDataURL(file);

        reader.onload = function(event){

            const img = new Image();

            img.src = event.target.result;

            img.onload = function(){

                const canvas = document.createElement("canvas");

                const MAX_WIDTH = 250;

                const scale = MAX_WIDTH / img.width;

                canvas.width = MAX_WIDTH;

                canvas.height = img.height * scale;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                resolve(canvas.toDataURL("image/jpeg", 0.5));
            };
        };
    });
}

// ADD REVIEW
async function addReview(){

    const name = document.getElementById("reviewName").value.trim();

    const rating = document.getElementById("reviewRating").value;

    const text = document.getElementById("reviewText").value.trim();

    const imageFile = document.getElementById("reviewImage").files[0];

    const submitBtn = document.getElementById("submitBtn");

    if(name === "" || rating === "" || text === ""){

        alert("Please complete all fields!");

        return;
    }

    submitBtn.disabled = true;

    submitBtn.innerHTML = "Submitting...";

    try{

        let reviews = [];

        // LOAD OLD DATA
        try{

            const response = await fetch(API_URL);

            if(response.ok){

                const oldData = await response.text();

                if(oldData && oldData.startsWith("[")){

                    reviews = JSON.parse(oldData);
                }
            }

        }catch(err){

            reviews = [];
        }

        let imageData = "";

        if(imageFile){

            imageData = await compressImage(imageFile);
        }

        const newReview = {

            name: name,

            rating: "⭐".repeat(parseInt(rating)),

            text: text,

            image: imageData
        };

        reviews.unshift(newReview);

        // SAVE ONLINE
        const save = await fetch(API_URL, {

            method: "POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify(reviews)
        });

        if(save.ok){

            alert("Review submitted!");

            // RESET
            document.getElementById("reviewName").value = "";

            document.getElementById("reviewRating").value = "";

            document.getElementById("reviewText").value = "";

            document.getElementById("reviewImage").value = "";

            // RESET STARS
            document.querySelectorAll(".star-rating span").forEach(star => {

                star.style.color = "#ccc";
            });

            // REFRESH REVIEWS
            displayReviews();

        }else{

            alert("Failed to save review.");
        }

    }catch(error){

        console.error(error);

        alert("Something went wrong.");
    }

    submitBtn.disabled = false;

    submitBtn.innerHTML = "Submit Review";
}

// DISPLAY REVIEWS
async function displayReviews(){

    const container = document.getElementById("reviewsContainer");

    try{

        const response = await fetch(API_URL);

        if(!response.ok){

            container.innerHTML = `
            <p class="loading-text">
                No reviews yet.
            </p>
            `;

            return;
        }

        const data = await response.text();

        if(!data || !data.startsWith("[")){

            container.innerHTML = `
            <p class="loading-text">
                No reviews yet.
            </p>
            `;

            return;
        }

        const reviews = JSON.parse(data);

        container.innerHTML = "";

        reviews.forEach(review => {

            let imageHTML = "";

            if(review.image){

                imageHTML = `
                <img src="${review.image}" class="review-img-display">
                `;
            }

            container.innerHTML += `

            <div class="review-item">

                <div class="review-profile">
                    ${review.name.charAt(0).toUpperCase()}
                </div>

                <div class="review-content">

                    <div class="review-top">

                        <div class="review-name">
                            ${review.name}
                        </div>

                        <div class="review-stars">
                            ${review.rating}
                        </div>

                    </div>

                    <div class="review-text">
                        ${review.text}
                    </div>

                    ${imageHTML}

                </div>

            </div>
            `;
        });

    }catch(error){

        console.error(error);

        container.innerHTML = `
        <p class="loading-text">
            Failed to load reviews.
        </p>
        `;
    }
}

</script>
