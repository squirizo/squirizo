<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* LALONG SINIGURADO ANG DISENYO PARA HINDI MAPUTOL ANG FORM */
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(135deg, #fff6ef, #fbe4d5) !important;
    min-height: 100vh;
    padding-bottom: 50px;
}

/* HEADER */
header{
    background: linear-gradient(90deg, #7b4b32, #a15c38);
    color: white;
    padding: 25px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

header h1{
    font-size: 45px;
    letter-spacing: 3px;
}

/* BACK BUTTON */
.back-btn{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 25px;
    padding: 12px 22px;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color: white !important;
    text-decoration: none;
    border-radius: 50px;
    font-weight: bold;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.back-btn:hover{
    transform: translateX(-5px);
}

/* REVIEW FORM MAIN CONTAINER */
.review-form{
    background: #ffffff !important;
    width: 90%;
    max-width: 550px;
    margin: 20px auto !important;
    padding: 35px !important;
    border-radius: 25px !important;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12) !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
}

.review-form h2{
    text-align: center;
    margin-bottom: 20px;
    color: #7b4b32;
    font-size: 32px;
}

/* INPUT FIELDS */
.review-form .input-group {
    margin-bottom: 15px;
}

.review-form label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #444;
}

.review-form input[type="text"],
.review-form textarea{
    width: 100% !important;
    padding: 15px !important;
    border-radius: 15px !important;
    border: 1px solid #ccc !important;
    font-size: 16px !important;
    background: #fff !important;
    color: #000 !important;
}

.review-form input[type="file"] {
    width: 100% !important;
    padding: 12px !important;
    border-radius: 15px !important;
    border: 1px solid #ccc !important;
    background: #fdfaf7 !important;
    cursor: pointer;
}

/* STAR RATING DESIGN */
.star-rating{
    text-align: center;
    margin: 15px 0;
}

.star-rating span{
    font-size: 45px;
    cursor: pointer;
    color: #ccc;
    transition: 0.2s;
    display: inline-block;
    padding: 0 4px;
}

.star-rating span.active{
    color: gold !important;
}

/* SUBMIT BUTTON */
.review-form button{
    width: 100% !important;
    padding: 15px !important;
    border: none !important;
    background: linear-gradient(45deg, #ff6600, #ff944d) !important;
    color: white !important;
    border-radius: 15px !important;
    font-size: 18px !important;
    cursor: pointer !important;
    font-weight: bold !important;
    margin-top: 10px;
    box-shadow: 0 4px 10px rgba(255,102,0,0.2);
}

.review-form button:hover {
    background: linear-gradient(45deg, #e65c00, #ff8033) !important;
}

/* REVIEWS LIST DISPLAY */
.reviews-list{
    width: 90%;
    max-width: 950px;
    margin: 50px auto;
}

.review-item{
    display: flex;
    gap: 18px;
    margin-bottom: 25px;
    padding: 25px;
    background: white;
    border-radius: 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.review-profile{
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    flex-shrink: 0;
}

.review-content{
    width: 100%;
}

.review-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.review-name{
    font-weight: bold;
    font-size: 20px;
}

.review-stars{
    color: gold;
    font-size: 20px;
}

.review-text{
    color: #555;
    line-height: 1.7;
}

.review-img-display{
    max-width: 100%;
    max-height: 280px;
    border-radius: 12px;
    margin-top: 15px;
    display: block;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.loading-text{
    text-align: center;
    font-size: 18px;
    color: #7b4b32;
    font-weight: bold;
}

@media(max-width:768px){
    header h1{ font-size:35px; }
    .review-form{ padding: 20px !important; }
    .review-item{ flex-direction: column; }
}
</style>
</head>

// Binabawasan ang bigat ng picture para magkasya sa internet database
function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400; 
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                resolve(dataUrl);
            };
        };
    });
}
