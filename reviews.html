<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SQUIRIZO Reviews</title>

<link rel="stylesheet" href="css.css">

<style>

body{
    background:#f5f5f5;
    font-family:Arial;
}

/* HEADER */

header{
    background:#7b4b32;
    color:white;
    padding:20px;
    text-align:center;
}

/* BACK BUTTON */

.back-btn{

    display:inline-block;
    margin:20px;
    padding:10px 20px;

    background:orangered;
    color:white;

    text-decoration:none;
    border-radius:10px;
}

/* REVIEW FORM */

.review-form{

    background:white;

    width:90%;
    max-width:500px;

    margin:auto;

    padding:25px;

    border-radius:15px;

    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.review-form h2{

    text-align:center;
    margin-bottom:20px;
}

.review-form input,
.review-form textarea,
.review-form select{

    width:100%;

    padding:12px;

    margin:10px 0;

    border-radius:10px;

    border:1px solid #ccc;
}

.review-form button{

    width:100%;

    padding:12px;

    border:none;

    background:orangered;

    color:white;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;
}

.review-form button:hover{

    background:#e64a19;
}

/* REVIEWS */

.reviews-container{

    width:90%;
    max-width:900px;

    margin:40px auto;

    display:flex;

    flex-wrap:wrap;

    gap:20px;

    justify-content:center;
}

.review-card{

    background:white;

    width:280px;

    padding:20px;

    border-radius:15px;

    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.review-card h3{

    color:orangered;
}

.review-card .stars{

    color:gold;
    font-size:20px;

    margin:10px 0;
}

.review-card p{

    color:#444;
}

</style>

</head>

<body>

<header>

    <h1>SQUIRIZO REVIEWS</h1>

</header>

<a href="home.html" class="back-btn">
← Back to Home
</a>

<!-- REVIEW FORM -->

<div class="review-form">

    <h2>Leave a Review</h2>

    <input type="text"
    id="reviewName"
    placeholder="Enter Your Name">

   <!-- STAR RATING -->

<div class="star-rating">

    <span onclick="setRating('⭐')">★</span>

    <span onclick="setRating('⭐⭐')">★</span>

    <span onclick="setRating('⭐⭐⭐')">★</span>

    <span onclick="setRating('⭐⭐⭐⭐')">★</span>

    <span onclick="setRating('⭐⭐⭐⭐⭐')">★</span>

</div>

<input type="hidden" id="reviewRating">

    <textarea
    id="reviewText"
    placeholder="Write your review here..."
    rows="5"></textarea>

    <button onclick="addReview()">

        Submit Review

    </button>

</div>

<!-- REVIEWS DISPLAY -->

<div class="reviews-container"
id="reviewsContainer">

</div>

<script>

// LOAD SAVED REVIEWS

window.onload = function(){

    displayReviews();
}

// ADD REVIEW

function addReview(){

    let name =
    document.getElementById(
    "reviewName").value;

    let rating =
    document.getElementById(
    "reviewRating").value;

    let text =
    document.getElementById(
    "reviewText").value;

    // VALIDATION

    if(name === "" ||
       rating === "" ||
       text === ""){

        alert("Please fill up all fields!");

        return;
    }

    // REVIEW OBJECT

    let review = {

        name:name,
        rating:rating,
        text:text
    };

    // GET OLD REVIEWS

    let reviews =
    JSON.parse(localStorage.getItem("reviews"))
    || [];

    // ADD NEW REVIEW

    reviews.push(review);

    // SAVE

    localStorage.setItem(
    "reviews",
    JSON.stringify(reviews)
    );

    // CLEAR FORM

    document.getElementById(
    "reviewName").value = "";

    document.getElementById(
    "reviewRating").value = "";

    document.getElementById(
    "reviewText").value = "";

    // REFRESH DISPLAY

    displayReviews();
}

// DISPLAY REVIEWS

function displayReviews(){

    let reviews =
    JSON.parse(localStorage.getItem("reviews"))
    || [];

    let container =
    document.getElementById(
    "reviewsContainer");

    container.innerHTML = "";

    reviews.reverse().forEach(function(review){

        container.innerHTML += `

        <div class="review-card">

            <h3>${review.name}</h3>

            <div class="stars">
                ${review.rating}
            </div>

            <p>${review.text}</p>

        </div>

        `;
    });
}

// STAR RATING

function setRating(rating){

    document.getElementById(
    "reviewRating").value = rating;

    let stars =
    document.querySelectorAll(
    ".star-rating span"
    );

    stars.forEach((star,index)=>{

        if(index < rating.length){

            star.classList.add("active");

        }else{

            star.classList.remove("active");
        }
    });
}

</script>

</body>
</html>
