<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQUIRIZO Reviews</title>
<link rel="stylesheet" href="css.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(135deg, #fff6ef, #fbe4d5);
    min-height:100vh;
}

/* HEADER */
header{
    background: linear-gradient(90deg, #7b4b32, #a15c38);
    color:white;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

header h1{
    font-size:45px;
    letter-spacing:3px;
}

/* BACK BUTTON */
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin:25px;
    padding:12px 22px;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-weight:bold;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.back-btn:hover{
    transform:translateX(-5px);
}

/* REVIEW FORM */
.review-form{
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    width:90%;
    max-width:550px;
    margin:auto;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.review-form h2{
    text-align:center;
    margin-bottom:25px;
    color:#7b4b32;
    font-size:32px;
}

/* INPUTS */
.review-form input,
.review-form textarea{
    width:100%;
    padding:15px;
    margin:12px 0;
    border-radius:15px;
    border:1px solid #ddd;
    font-size:16px;
}

/* FILE INPUT BUTTON STYLE */
.review-form input[type="file"] {
    background: #fdfaf7;
    cursor: pointer;
    padding: 10px;
}

/* BUTTON */
.review-form button{
    width:100%;
    padding:15px;
    border:none;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color:white;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
}

/* STAR RATING */
.star-rating{
    text-align:center;
    margin-bottom:15px;
}

.star-rating span{
    font-size:40px;
    cursor:pointer;
    opacity:0.4;
    transition:0.3s;
}

.star-rating span.active{
    opacity:1;
    color:gold;
}

/* REVIEWS CONTAINER */
.reviews-list{
    width:90%;
    max-width:950px;
    margin:50px auto;
}

.review-item{
    display:flex;
    gap:18px;
    margin-bottom:25px;
    padding:25px;
    background:white;
    border-radius:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.review-profile{
    width:60px;
    height:60px;
    border-radius:50%;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    flex-shrink:0;
}

.review-content{
    width:100%;
}

.review-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.review-name{
    font-weight:bold;
    font-size:20px;
}

.review-stars{
    color:gold;
    font-size:20px;
}

.review-text{
    color:#555;
    line-height:1.7;
    margin-bottom: 10px;
}

.review-img-display{
    max-width: 100%;
    max-height: 250px;
    border-radius: 12px;
    margin-top: 10px;
    display: block;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.loading-text{
    text-align: center;
    font-size: 18px;
    color: #7b4b32;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>SQUIRIZO REVIEWS</h1>
</header>

<a href="index.html" class="back-btn">← Back to Home</a>

<div class="review-form">
    <h2>Leave a Review</h2>
    
    <input type="text" id="reviewName" placeholder="Enter Your Name">

    <div class="star-rating">
        <span onclick="setRating('⭐')">★</span>
        <span onclick="setRating('⭐⭐')">★</span>
        <span onclick="setRating('⭐⭐⭐')">★</span>
        <span onclick="setRating('⭐⭐⭐⭐')">★</span>
        <span onclick="setRating('⭐⭐⭐⭐⭐')">★</span>
    </div>
    
    <input type="hidden" id="reviewRating">

    <textarea id="reviewText" placeholder="Write your review here..." rows="5"></textarea>
    
    <input type="file" id="reviewImage" accept="image/*">
    
    <button id="submitBtn" onclick="addReview()">Submit Review</button>
</div>

<div class="reviews-list" id="reviewsContainer">
    <p class="loading-text">Loading reviews...</p>
</div>

<script>
const API_URL = "https://kvdb.io/BYz7cfcbgzkiw4pGvGfdpg/squirizo_key";

window.onload = function(){
    displayReviews();
}

// 🗜️ UTILITY FUNCTION: Pinapaliit nito ang imahe bago i-save para hindi mag-error sa database size limit
function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = event => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400; // Pinaliliit ang width para maging sobrang gaan ng file
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // Ginagawang WebP/JPEG format na compressed (0.6 quality)
                const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                resolve(dataUrl);
            };
        };
    });
}

async function addReview(){
    let name = document.getElementById("reviewName").value.trim();
    let rating = document.getElementById("reviewRating").value;
    let text = document.getElementById("reviewText").value.trim();
    let imageFile = document.getElementById("reviewImage").files[0];
    let submitBtn = document.getElementById("submitBtn");

    if(name === "" || rating === "" || text === ""){
        alert("Please fill up all fields!");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = "Submitting with Image...";

    try {
        let imageDataBase64 = "";
        
        // Kung nagpili ng larawan, automatic itong iko-compress para maging ligtas i-upload
        if (imageFile) {
            try {
                imageDataBase64 = await compressImage(imageFile);
            } catch(err) {
                console.error("Compression error:", err);
            }
        }

        let reviewsList = [];
        
        // 1. Kunin ang lumang data
        try {
            let getResponse = await fetch(API_URL);
            if(getResponse.ok) {
                let textData = await getResponse.text();
                if (textData && textData.trim().startsWith("[")) {
                    reviewsList = JSON.parse(textData);
                }
            }
        } catch(e) {
            reviewsList = [];
        }

        if(!Array.isArray(reviewsList)) reviewsList = [];

        // 2. Idagdag ang bago mong review kasama ang compressed image data
        let newReview = { name, rating, text, image: imageDataBase64 };
        reviewsList.unshift(newReview);

        // 3. I-save sa database gamit ang matatag na PUT method
        let putResponse = await fetch(API_URL, {
            method: "PUT", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(reviewsList)
        });

        if(putResponse.ok){
            alert("Thank you! Your review with image has been saved online. ❤️");
            document.getElementById("reviewName").value = "";
            document.getElementById("reviewRating").value = "";
            document.getElementById("reviewText").value = "";
            document.getElementById("reviewImage").value = "";
            
            let stars = document.querySelectorAll(".star-rating span");
            stars.forEach(star => star.classList.remove("active"));
            
            displayReviews();
        } else {
            alert("Database rejected the submit. Code: " + putResponse.status + "\nTip: Subukan ang mas maliit na larawan.");
        }
    } catch (error) {
        console.error(error);
        alert("Something went wrong. Please try again.");
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Submit Review";
    }
}

async function displayReviews(){
    let container = document.getElementById("reviewsContainer");

    try {
        let response = await fetch(API_URL);
        if(!response.ok) {
            container.innerHTML = '<p class="loading-text">No reviews yet. Be the first to leave one!</p>';
            return;
        }
        
        let textData = await response.text();
        if(!textData || !textData.trim().startsWith("[")) {
            container.innerHTML = '<p class="loading-text">No reviews yet. Be the first to leave one!</p>';
            return;
        }

        let reviews = JSON.parse(textData);
        container.innerHTML = "";

        if(!reviews || reviews.length === 0){
            container.innerHTML = '<p class="loading-text">No reviews yet. Be the first to leave one!</p>';
            return;
        }

        reviews.forEach(function(review){
            let firstLetter = review.name ? review.name.charAt(0).toUpperCase() : "U";
            
            // I-checheck kung may valid image data na naka-save para i-display
            let imgTag = "";
            if (review.image && review.image.startsWith("data:image")) {
                imgTag = `<img src="${review.image}" class="review-img-display" alt="Review Image">`;
            }

            container.innerHTML += `
            <div class="review-item">
                <div class="review-profile">${firstLetter}</div>
                <div class="review-content">
                    <div class="review-top">
                        <div class="review-name">${review.name}</div>
                        <div class="review-stars">${review.rating}</div>
                    </div>
                    <div class="review-text">${review.text}</div>
                    ${imgTag}
                </div>
            </div>
            `;
        });
    } catch (error) {
        console.error(error);
        container.innerHTML = '<p class="loading-text">No reviews yet. Be the first to leave one!</p>';
    }
}

function setRating(rating){
    document.getElementById("reviewRating").value = rating;
    let stars = document.querySelectorAll(".star-rating span");

    stars.forEach((star, index) => {
        if(index < rating.length){
            star.classList.add("active");
        }else{
            star.classList.remove("active");
        }
    });
}
</script>

</body>
</html>
