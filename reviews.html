<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUIRIZO Reviews</title>
    <style>
        /* CSS mo */
        *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
        body{ background: linear-gradient(135deg, #fff6ef, #fbe4d5); min-height:100vh; }
        header{ background: linear-gradient(90deg, #7b4b32, #a15c38); color:white; padding:25px; text-align:center; }
        .back-btn{ display:inline-flex; align-items:center; gap:10px; margin:25px; padding:12px 22px; background: linear-gradient(45deg, #ff6600, #ff944d); color:white; text-decoration:none; border-radius:50px; font-weight:bold; }
        .review-form{ background:rgba(255,255,255,0.95); width:90%; max-width:550px; margin:auto; padding:35px; border-radius:25px; box-shadow:0 10px 25px rgba(0,0,0,0.12); }
        .review-form input, .review-form textarea{ width:100%; padding:15px; margin:12px 0; border-radius:15px; border:1px solid #ddd; }
        .review-form button{ width:100%; padding:15px; border:none; background: linear-gradient(45deg, #ff6600, #ff944d); color:white; border-radius:15px; font-weight:bold; cursor:pointer; }
        .star-rating span{ font-size:40px; cursor:pointer; color: #ccc; }
        .star-rating span.active{ color:gold; }
        .reviews-list{ width:90%; max-width:950px; margin:50px auto; }
        .review-item{ display:flex; gap:18px; margin-bottom:25px; padding:25px; background:white; border-radius:25px; box-shadow:0 8px 20px rgba(0,0,0,0.08); }
        .review-profile{ width:60px; height:60px; border-radius:50%; background:#ff6600; color:white; display:flex; justify-content:center; align-items:center; font-weight:bold; flex-shrink:0; }
        .review-content{ width:100%; }
        /* STAR RATING */
.star-rating {
    display: flex;             /* Ginagawa itong flex container */
    justify-content: center;   /* Pag-center ng mga star horizontally */
    align-items: center;       /* Pag-center vertically */
    gap: 5px;                  /* Distansya sa pagitan ng mga star */
    margin-bottom: 15px;
}

.star-rating span {
    font-size: 40px;
    cursor: pointer;
    color: #ccc;               /* Grey color kapag hindi pa napipili */
    transition: 0.3s;
}

.star-rating span.active {
    color: gold;               /* Gold color kapag napili */
}
    </style>
</head>
<body>

<header><h1>SQUIRIZO REVIEWS</h1></header>
<a href="index.html" class="back-btn">← Back to Home</a>

<div class="review-form">
    <h2>Leave a Review</h2>
    <input type="text" id="reviewName" placeholder="Enter Your Name">
    <div class="star-rating">
        <span onclick="setRating(1)">★</span><span onclick="setRating(2)">★</span><span onclick="setRating(3)">★</span><span onclick="setRating(4)">★</span><span onclick="setRating(5)">★</span>
    </div>
    <input type="hidden" id="reviewRating" value="0">
    <textarea id="reviewText" placeholder="Write your review here..." rows="5"></textarea>
    <input type="file" id="reviewImage" accept="image/*">
    <button onclick="saveToSpreadsheet()">Submit Review</button>
</div>

<div class="reviews-list" id="reviewsContainer"></div>

<script>
const API_URL = "https://sheetdb.io/api/v1/zxmdtvlmdyb9u"; 
const IMGBB_KEY = "5cfa734553b984fe1453996cb6016322"; 

async function saveToSpreadsheet() {
    const name = document.getElementById("reviewName").value;
    const rating = document.getElementById("reviewRating").value;
    const text = document.getElementById("reviewText").value;
    const file = document.getElementById("reviewImage").files[0];

    if (!name || rating == 0 || !text) return alert("Paki-fill up lahat!");

    let imageUrl = "";
    if (file) {
        const formData = new FormData();
        formData.append("image", file);
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
            method: "POST",
            body: formData
        });
        const result = await response.json();
        if(result.success) imageUrl = result.data.url;
    }

    await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ data: [{ name, rating: "⭐".repeat(rating), text, image: imageUrl }] })
    });
    alert("Review saved!");
    location.reload();
}

async function displayReviews() {
    const container = document.getElementById("reviewsContainer");
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        container.innerHTML = data.reverse().map(r => `
            <div class="review-item">
                <div class="review-profile">${r.name ? r.name[0].toUpperCase() : 'U'}</div>
                <div class="review-content">
                    <div style="font-weight:bold; font-size:20px;">${r.name}</div>
                    <div style="color:gold">${r.rating}</div>
                    <div style="margin-top:5px; color:#555;">${r.text}</div>
                    ${r.image ? `<img src="${r.image}" style="max-width:150px; margin-top:10px; border-radius:10px;">` : ""}
                </div>
            </div>
        `).join("");
    } catch (e) {
        container.innerHTML = "Error loading reviews.";
    }
}

function setRating(val) {
    document.getElementById("reviewRating").value = val;
    document.querySelectorAll(".star-rating span").forEach((s, i) => s.classList.toggle("active", i < val));
}

// Dito tinatawag ang function pag load ng page
displayReviews();
</script>
</body>
</html>
