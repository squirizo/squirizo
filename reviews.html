<script>

const BUCKET_ID = "BYz7cfcbgzkiw4pGvGfdpg";
const API_URL = `https://kvdb.io/${BUCKET_ID}/squirizo_live_data`;

window.onload = function(){
    displayReviews();
}

function compressImage(file) {
    return new Promise((resolve) => {

        const reader = new FileReader();

        reader.readAsDataURL(file);

        reader.onload = event => {

            const img = new Image();

            img.src = event.target.result;

            img.onload = () => {

                const canvas = document.createElement('canvas');

                const MAX_WIDTH = 250;

                const scaleSize = MAX_WIDTH / img.width;

                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;

                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.4);

                resolve(dataUrl);
            };
        };
    });
}

async function addReview(){

    let name = document.getElementById("reviewName").value.trim();

    let ratingNum = document.getElementById("reviewRating").value;

    let text = document.getElementById("reviewText").value.trim();

    let imageFile = document.getElementById("reviewImage").files[0];

    let submitBtn = document.getElementById("submitBtn");

    if(name === "" || ratingNum === "" || text === ""){

        alert("Please fill up all fields and rating!");

        return;
    }

    submitBtn.disabled = true;

    submitBtn.innerHTML = "Submitting...";

    try{

        let imageDataBase64 = "";

        if(imageFile){

            imageDataBase64 = await compressImage(imageFile);
        }

        let reviewsList = [];

        // LOAD OLD REVIEWS
        try{

            let response = await fetch(API_URL);

            if(response.ok){

                let textData = await response.text();

                if(textData && textData.startsWith("[")){

                    reviewsList = JSON.parse(textData);
                }
            }

        }catch(err){

            reviewsList = [];
        }

        let newReview = {

            name: name,

            rating: "⭐".repeat(parseInt(ratingNum)),

            text: text,

            image: imageDataBase64
        };

        reviewsList.unshift(newReview);

        // SAVE REVIEWS
        let saveResponse = await fetch(API_URL, {

            method: "POST",

            headers:{
                "Content-Type":"application/json"
            },

            body: JSON.stringify(reviewsList)
        });

        if(saveResponse.ok){

            alert("Review submitted successfully!");

            document.getElementById("reviewName").value = "";

            document.getElementById("reviewRating").value = "";

            document.getElementById("reviewText").value = "";

            document.getElementById("reviewImage").value = "";

            let stars = document.querySelectorAll(".star-rating span");

            stars.forEach(star => {

                star.style.color = "#ccc";
            });

            displayReviews();

        }else{

            alert("Failed to save review.");
        }

    }catch(error){

        console.error(error);

        alert("Error submitting review.");
    }

    submitBtn.disabled = false;

    submitBtn.innerHTML = "Submit Review";
}

async function displayReviews(){

    let container = document.getElementById("reviewsContainer");

    try{

        let response = await fetch(API_URL);

        if(!response.ok){

            container.innerHTML = `
            <p class="loading-text">
                No reviews yet.
            </p>
            `;

            return;
        }

        let textData = await response.text();

        if(!textData || !textData.startsWith("[")){

            container.innerHTML = `
            <p class="loading-text">
                No reviews yet.
            </p>
            `;

            return;
        }

        let reviews = JSON.parse(textData);

        container.innerHTML = "";

        reviews.forEach(function(review){

            let firstLetter = review.name.charAt(0).toUpperCase();

            let imageHTML = "";

            if(review.image){

                imageHTML = `
                <img src="${review.image}" class="review-img-display">
                `;
            }

            container.innerHTML += `

            <div class="review-item">

                <div class="review-profile">
                    ${firstLetter}
                </div>

                <div class="review-content">

                    <div class="review-top">

                        <div class="review-name">
                            ${review.name}
                        </div>

                        <div class="review-stars">
                            ${review.rating}
                        </div>

                    </div>

                    <div class="review-text">
                        ${review.text}
                    </div>

                    ${imageHTML}

                </div>

            </div>
            `;
        });

    }catch(error){

        console.error(error);

        container.innerHTML = `
        <p class="loading-text">
            Failed to load reviews.
        </p>
        `;
    }
}

function setRating(ratingValue){

    document.getElementById("reviewRating").value = ratingValue;

    let stars = document.querySelectorAll(".star-rating span");

    stars.forEach((star, index) => {

        if(index < ratingValue){

            star.style.color = "gold";

        }else{

            star.style.color = "#ccc";
        }
    });
}

</script>
