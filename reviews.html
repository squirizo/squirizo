<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQUIRIZO Reviews</title>
<link rel="stylesheet" href="css.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background: linear-gradient(135deg, #fff6ef, #fbe4d5);
    min-height:100vh;
}

/* HEADER */
header{
    background: linear-gradient(90deg, #7b4b32, #a15c38);
    color:white;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

header h1{
    font-size:45px;
    letter-spacing:3px;
}

/* BACK BUTTON */
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin:25px;
    padding:12px 22px;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-weight:bold;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
    transition:0.3s;
}

.back-btn:hover{
    transform:translateX(-5px);
}

/* REVIEW FORM */
.review-form{
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);
    width:90%;
    max-width:550px;
    margin:auto;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.review-form h2{
    text-align:center;
    margin-bottom:25px;
    color:#7b4b32;
    font-size:32px;
}

/* INPUTS */
.review-form input,
.review-form textarea{
    width:100%;
    padding:15px;
    margin:12px 0;
    border-radius:15px;
    border:1px solid #ddd;
    font-size:16px;
}

/* BUTTON */
.review-form button{
    width:100%;
    padding:15px;
    border:none;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color:white;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
}

/* STAR RATING */
.star-rating{
    text-align:center;
    margin-bottom:15px;
}

.star-rating span{
    font-size:40px;
    cursor:pointer;
    color: #ccc; /* Default gray pag di pa naka-click */
    transition: 0.2s;
    display: inline-block;
}

/* REVIEWS CONTAINER */
.reviews-list{
    width:90%;
    max-width:950px;
    margin:50px auto;
}

.review-item{
    display:flex;
    gap:18px;
    margin-bottom:25px;
    padding:25px;
    background:white;
    border-radius:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.review-profile{
    width:60px;
    height:60px;
    border-radius:50%;
    background: linear-gradient(45deg, #ff6600, #ff944d);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    flex-shrink:0;
}

.review-content{
    width:100%;
}

.review-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.review-name{
    font-weight:bold;
    font-size:20px;
}

.review-stars{
    color:gold;
    font-size:20px;
}

.review-text{
    color:#555;
    line-height:1.7;
}

.review-img-display{
    max-width: 100%;
    max-height: 250px;
    border-radius: 12px;
    margin-top: 10px;
    display: block;
}

.loading-text{
    text-align: center;
    font-size: 18px;
    color: #7b4b32;
    font-weight: bold;
}
</style>
</head>

    <h1>SQUIRIZO REVIEWS</h1>
</header>
