<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SQUIRIZO Reviews</title>

<link rel="stylesheet" href="css.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    background:
    linear-gradient(
    135deg,
    #fff6ef,
    #fbe4d5
    );

    min-height:100vh;
}

/* HEADER */

header{

    background:
    linear-gradient(
    90deg,
    #7b4b32,
    #a15c38
    );

    color:white;

    padding:25px;

    text-align:center;

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

    animation:fadeDown 1s ease;
}

header h1{

    font-size:45px;

    letter-spacing:3px;
}

/* BACK BUTTON */

.back-btn{

    display:inline-flex;

    align-items:center;

    gap:10px;

    margin:25px;

    padding:12px 22px;

    background:
    linear-gradient(
    45deg,
    #ff6600,
    #ff944d
    );

    color:white;

    text-decoration:none;

    border-radius:50px;

    font-weight:bold;

    box-shadow:0 6px 15px rgba(0,0,0,0.15);

    transition:0.3s;
}

.back-btn:hover{

    transform:translateX(-5px);

    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* REVIEW FORM */

.review-form{

    background:rgba(255,255,255,0.95);

    backdrop-filter:blur(10px);

    width:90%;
    max-width:550px;

    margin:auto;

    padding:35px;

    border-radius:25px;

    box-shadow:0 10px 25px rgba(0,0,0,0.12);

    animation:fadeUp 1s ease;
}

.review-form h2{

    text-align:center;

    margin-bottom:25px;

    color:#7b4b32;

    font-size:32px;
}

/* INPUTS */

.review-form input,
.review-form textarea{

    width:100%;

    padding:15px;

    margin:12px 0;

    border-radius:15px;

    border:1px solid #ddd;

    font-size:16px;

    transition:0.3s;
}

.review-form input:focus,
.review-form textarea:focus{

    border-color:#ff6600;

    outline:none;

    box-shadow:0 0 10px rgba(255,102,0,0.2);
}

/* BUTTON */

.review-form button{

    width:100%;

    padding:15px;

    border:none;

    background:
    linear-gradient(
    45deg,
    #ff6600,
    #ff944d
    );

    color:white;

    border-radius:15px;

    font-size:18px;

    cursor:pointer;

    margin-top:10px;

    transition:0.3s;

    font-weight:bold;
}

.review-form button:hover{

    transform:scale(1.03);

    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* STAR RATING */

.star-rating{

    text-align:center;

    margin-bottom:15px;
}

.star-rating span{

    font-size:40px;

    cursor:pointer;

    opacity:0.4;

    transition:0.3s;
}

.star-rating span:hover{

    transform:scale(1.2);

    color:gold;
}

.star-rating span.active{

    opacity:1;

    color:gold;
}

/* REVIEWS CONTAINER */

.reviews-list{

    width:90%;
    max-width:950px;

    margin:50px auto;
}

/* REVIEW ITEM */

.review-item{

    display:flex;

    gap:18px;

    margin-bottom:25px;

    padding:25px;

    background:white;

    border-radius:25px;

    box-shadow:0 8px 20px rgba(0,0,0,0.08);

    transition:0.3s;

    animation:cardFade 0.8s ease;
}

.review-item:hover{

    transform:translateY(-5px);

    box-shadow:0 15px 30px rgba(0,0,0,0.12);
}

/* PROFILE */

.review-profile{

    width:60px;

    height:60px;

    border-radius:50%;

    background:
    linear-gradient(
    45deg,
    #ff6600,
    #ff944d
    );

    color:white;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:24px;

    font-weight:bold;

    flex-shrink:0;

    box-shadow:0 5px 15px rgba(255,102,0,0.3);
}

/* REVIEW CONTENT */

.review-content{

    width:100%;
}

/* TOP */

.review-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;

    flex-wrap:wrap;
}

/* NAME */

.review-name{

    font-weight:bold;

    font-size:20px;

    color:#222;
}

/* STARS */

.review-stars{

    color:gold;

    font-size:20px;
}

/* TEXT */

.review-text{

    color:#555;

    line-height:1.7;

    font-size:16px;

    margin-top:8px;
}

/* ANIMATIONS */

@keyframes fadeDown{

    from{

        opacity:0;

        transform:translateY(-40px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(40px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

@keyframes cardFade{

    from{

        opacity:0;

        transform:translateY(30px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:768px){

    header h1{

        font-size:35px;
    }

    .review-form{

        padding:25px;
    }

    .review-item{

        flex-direction:column;

        align-items:flex-start;
    }

    .review-top{

        flex-direction:column;

        align-items:flex-start;

        gap:5px;
    }
}

</style>

</head>

<body>

<header>

    <h1>SQUIRIZO REVIEWS</h1>

</header>

<a href="home.html" class="back-btn">
← Back to Home
</a>

<!-- REVIEW FORM -->

<div class="review-form">

    <h2>Leave a Review</h2>

    <input type="text"
    id="reviewName"
    placeholder="Enter Your Name">

   <!-- STAR RATING -->

<div class="star-rating">

    <span onclick="setRating('⭐')">★</span>

    <span onclick="setRating('⭐⭐')">★</span>

    <span onclick="setRating('⭐⭐⭐')">★</span>

    <span onclick="setRating('⭐⭐⭐⭐')">★</span>

    <span onclick="setRating('⭐⭐⭐⭐⭐')">★</span>

</div>

<input type="hidden" id="reviewRating">

    <textarea
    id="reviewText"
    placeholder="Write your review here..."
    rows="5"></textarea>

    <button onclick="addReview()">

        Submit Review

    </button>

</div>

<!-- REVIEWS DISPLAY -->

<div class="reviews-list"
id="reviewsContainer">

</div>

<script>

// LOAD SAVED REVIEWS

window.onload = function(){

    displayReviews();
}

// ADD REVIEW

function addReview(){

    let name =
    document.getElementById(
    "reviewName").value;

    let rating =
    document.getElementById(
    "reviewRating").value;

    let text =
    document.getElementById(
    "reviewText").value;

    // VALIDATION

    if(name === "" ||
       rating === "" ||
       text === ""){

        alert("Please fill up all fields!");

        return;
    }

    // REVIEW OBJECT

    let review = {

        name:name,
        rating:rating,
        text:text
    };

    // GET OLD REVIEWS

    let reviews =
    JSON.parse(localStorage.getItem("reviews"))
    || [];

    // ADD NEW REVIEW

    reviews.push(review);

    // SAVE

    localStorage.setItem(
    "reviews",
    JSON.stringify(reviews)
    );

    // CLEAR FORM

    document.getElementById(
    "reviewName").value = "";

    document.getElementById(
    "reviewRating").value = "";

    document.getElementById(
    "reviewText").value = "";

    // REFRESH DISPLAY

    displayReviews();
}

// DISPLAY REVIEWS

function displayReviews(){

    let reviews =
    JSON.parse(localStorage.getItem("reviews"))
    || [];

    let container =
    document.getElementById(
    "reviewsContainer");

    container.innerHTML = "";

    reviews.reverse().forEach(function(review){

        let firstLetter =
        review.name.charAt(0).toUpperCase();

        container.innerHTML += `

        <div class="review-item">

            <div class="review-profile">
                ${firstLetter}
            </div>

            <div class="review-content">

                <div class="review-top">

                    <div class="review-name">
                        ${review.name}
                    </div>

                    <div class="review-stars">
                        ${review.rating}
                    </div>

                </div>

                <div class="review-text">
                    ${review.text}
                </div>

            </div>

        </div>

        `;
    });
}
// STAR RATING

function setRating(rating){

    document.getElementById(
    "reviewRating").value = rating;

    let stars =
    document.querySelectorAll(
    ".star-rating span"
    );

    stars.forEach((star,index)=>{

        if(index < rating.length){

            star.classList.add("active");

        }else{

            star.classList.remove("active");
        }
    });
}

</script>

</body>
</html>
