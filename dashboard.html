<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUIRIZO Dashboard</title>

    <link rel="stylesheet" href="css.css">

    <style>

        body{
            background: #f5f5f5;
            font-family: Arial;
        }

        .dashboard-container{
            width: 90%;
            margin: 40px auto;
        }

        .dashboard-title{
            text-align: center;
            font-size: 45px;
            color: #7a3e1d;
            margin-bottom: 40px;
        }

        .dashboard-box{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card{
            background: white;
            width: 250px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h2{
            font-size: 40px;
            color: orangered;
        }

        .card p{
            font-size: 20px;
        }

        .back-btn{
            display: inline-block;
            margin: 20px;
            padding: 12px 20px;
            background: orangered;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <a href="home.html" class="back-btn">
        ← Back to Home
    </a>

    <div class="dashboard-container">

        <h1 class="dashboard-title">
            SQUIRIZO Dashboard
        </h1>

        <div class="dashboard-box">

            <div class="card">
                <h2>120</h2>
                <p>Total Orders</p>
            </div>

            <div class="card">
                <h2>₱5,500</h2>
                <p>Total Sales</p>
            </div>

            <div class="card">
                <h2>58</h2>
                <p>Customers</p>
            </div>

            <div class="card">
                <h2>4.9★</h2>
                <p>Ratings</p>
            </div>

        </div>

    </div>

</body>
</html>
