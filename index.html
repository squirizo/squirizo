<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUIRIZO</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="css.css">
</head>
    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding-left:600px;

    background-image: url('login_cover.jpeg');
    background-size: cover;
    background-position: center;
}

/* TRANSPARENT FORM */

.container{
    width:350px;
    padding:30px;
    border-radius:20px;
    background: rgba(255, 255, 255, 0.059);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid rgba(220, 218, 218, 0.3);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h1{
    color:white;
    font-size:35px;
}

.form-box h2{
    text-align:center;
    margin-bottom:20px;
    color:white;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;

    background: rgba(255,255,255,0.2);

    color:white;

    border:1px solid rgba(255,255,255,0.5);

    font-size:16px;
}

input::placeholder{
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:orangered;
    color:white;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#e64a19;
}

.toggle-text{
    text-align:center;
    margin-top:15px;
    color:white;
}

.toggle-text a{
    color:yellow;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

#registerForm{
    display:none;
}

.success{
    color:lightgreen;
    text-align:center;
    margin-top:10px;
}

/* RESPONSIVE */

@media(max-width:768px){

    body{
        justify-content:center;
        padding-right:0;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:350px;
    }
}

</style>
<body>

    <div class="container">

        <div class="logo">
            <h1> SQUIRIZO</h1>
        </div>

        <!-- LOGIN FORM -->
        <div class="form-box" id="loginForm">
            <h2>Login</h2>

            <input type="email" id="loginEmail" placeholder="Enter Email">
            <input type="password" id="loginPassword" placeholder="Enter Password">

            <button href="home.html" onclick="login()">Login</button>

            <div class="toggle-text">
                Don't have an account?
                <a onclick="showRegister()">Register</a>
            </div>

            <p id="loginMessage" class="success"></p>
        </div>

        <!-- REGISTER FORM -->
        <div class="form-box" id="registerForm">
            <h2>Register</h2>

            <input type="text" id="registerName" placeholder="Full Name">
            <input type="email" id="registerEmail" placeholder="Enter Email">
            <input type="password" id="registerPassword" placeholder="Create Password">

            <button onclick="register()">Register</button>

            <div class="toggle-text">
                Already have an account?
                <a onclick="showLogin()">Login</a>
            </div>

            <p id="registerMessage" class="success"></p>
        </div>

    </div>

    <script>

        function showRegister(){
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function showLogin(){
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        function register(){

            let name = document.getElementById('registerName').value;
            let email = document.getElementById('registerEmail').value;
            let password = document.getElementById('registerPassword').value;

            if(name === '' || email === '' || password === ''){
                alert('Please fill up all fields');
                return;
            }

            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPassword', password);

            document.getElementById('registerMessage').innerHTML =
            'Registration Successful!';
        }

        function login(){

            let email = document.getElementById('loginEmail').value;
            let password = document.getElementById('loginPassword').value;

            let storedEmail = localStorage.getItem('userEmail');
            let storedPassword = localStorage.getItem('userPassword');

            if(email === storedEmail && password === storedPassword){

                document.getElementById('loginMessage').innerHTML =
                'Login Successful!';

                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1000);

            }else{
                alert('Invalid Email or Password');
            }
        }

    </script>

</body>
</html>
