<script>
let total = 0;
let orders = {
    squirizo: 0,
    spicy: 0
};

// =========================
// ADD ITEM
// =========================
function addItem(item, price){
    orders[item]++;
    total += price;
    updateOrders();
}

// =========================
// MINUS ITEM
// =========================
function minusItem(item, price){
    if(orders[item] > 0){
        orders[item]--;
        total -= price;
        updateOrders();
    }
}

// =========================
// UPDATE ORDERS
// =========================
function updateOrders(){
    const orderList = document.getElementById("order-list");
    orderList.innerHTML = "";

    document.getElementById("squirizo-count").innerHTML = orders.squirizo;
    document.getElementById("spicy-count").innerHTML = orders.spicy;

    if(orders.squirizo > 0){
        const li = document.createElement("li");
        li.innerHTML = `SQUIRIZO x ${orders.squirizo} = ₱${orders.squirizo * 50}`;
        orderList.appendChild(li);
    }

    if(orders.spicy > 0){
        const li = document.createElement("li");
        li.innerHTML = `SQUIRIZO SPICY x ${orders.spicy} = ₱${orders.spicy * 55}`;
        orderList.appendChild(li);
    }

    document.getElementById("total").innerHTML = `Total: ₱${total}`;
}

// =========================
// OPEN ORDER FORM
// =========================
function openOrderForm(){
    if(total === 0){
        alert("Please order first!");
        return;
    }
    document.getElementById("orderModal").style.display = "flex";
}

// =========================
// CLOSE ORDER FORM
// =========================
function closeOrderForm(){
    document.getElementById("orderModal").style.display = "none";
}

// =========================
// SHOW GCASH FIELD
// =========================
function showGcashField(){
    let payment = document.getElementById("paymentMethod").value;
    let gcashField = document.getElementById("gcashField");
    let qrBox = document.getElementById("qrBox");

    if(payment === "GCash"){
        gcashField.style.display = "block";
        qrBox.style.display = "block";
    }else{
        gcashField.style.display = "none";
        qrBox.style.display = "none";
    }
}

// =========================
// SUBMIT ORDER
// =========================
async function submitOrder(){
    let customerName = document.getElementById("customerName").value.trim();
    let customerContact = document.getElementById("customerContact").value.trim();
    let address = document.getElementById("customerAddress").value.trim();
    let paymentMethod = document.getElementById("paymentMethod").value;
    let gcashNumber = document.getElementById("gcashNumber").value.trim();
    let referenceNumber = document.getElementById("referenceNumber").value.trim();
    let paymentScreenshot = document.getElementById("paymentScreenshot").files[0];

    // FORM DATA
    const formData = new FormData();
    formData.append("access_key", "c8317cf4-ff2e-4c55-84c0-61aaecedaff7");
    formData.append("name", customerName);
    formData.append("subject", "New SQUIRIZO Order");
    
    let ordersText = "";
    if(orders.squirizo > 0) ordersText += `SQUIRIZO x ${orders.squirizo}\n`;
    if(orders.spicy > 0) ordersText += `SQUIRIZO SPICY x ${orders.spicy}\n`;

    formData.append("message",
`NEW ORDER

Customer:
${customerName}

Contact Number:
${customerContact}

Address:
${address}

Orders:
${ordersText}

Payment Method:
${paymentMethod}

GCash Number:
${gcashNumber}

Reference Number:
${referenceNumber}

Total:
₱${total}`
    );

    if(paymentScreenshot){
        formData.append("attachment", paymentScreenshot);
    }

    try{
        const response = await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            body: formData
        });
        const result = await response.json();
        if(result.success){
            alert("Order Successful ❤️");
            
            // RESET
            orders.squirizo = 0;
            orders.spicy = 0;
            total = 0;
            updateOrders();

            document.getElementById("customerName").value = "";
            document.getElementById("customerContact").value = "";
            document.getElementById("customerAddress").value = "";
            document.getElementById("paymentMethod").value = "";
            document.getElementById("gcashNumber").value = "";
            document.getElementById("referenceNumber").value = "";
            document.getElementById("paymentScreenshot").value = "";

            closeOrderForm();
        }else{
            alert("Failed to send order ❌");
        }
    }catch(error){
        console.log(error);
        alert("Something went wrong ❌");
    }
}

// =========================
// MOBILE MENU
// =========================
function toggleMenu(){
    document.querySelector("nav").classList.toggle("active");
}

// =========================
// PAY + SUBMIT ORDER (FIXED FOR iOS & ANDROID)
// =========================
function payAndSubmit(){
    let customerName = document.getElementById("customerName").value.trim();
    let customerContact = document.getElementById("customerContact").value.trim();
    let address = document.getElementById("customerAddress").value.trim();
    let paymentMethod = document.getElementById("paymentMethod").value;
    let gcashNumber = document.getElementById("gcashNumber").value.trim();

    // 1. VALIDATION FIRST BEFORE ANYTHING ELSE
    if(customerName === "" || customerContact === "" || address === "" || paymentMethod === ""){
        alert("Please fill up all fields!");
        return;
    }
    if(customerContact.length !== 11 || !customerContact.startsWith("09")){
        alert("Contact number must be 11 digits and start with 09");
        return;
    }
    if(address.length < 10){
        alert("Please enter complete address!");
        return;
    }
    if(paymentMethod === "GCash" && gcashNumber === ""){
        alert("Please enter GCash number!");
        return;
    }

    // 2. REDIRECTION & SUBMISSION FLOW
    if(paymentMethod === "GCash"){
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if(isMobile){
            // Gagamit tayo ng ligtas na URL intent na hindi mag-e-error sa Safari/iOS
            // Ito ay magdadala sa kanila sa app store o diretso sa app kung installed ito.
            window.location.href = "https://m.gcash.com"; 

            // Habang binubuksan ang GCash app sa phone, i-execute ang pag-send sa Web3Forms
            // para pumasok pa rin ang order details mo pagbalik nila.
            setTimeout(() => {
                submitOrder();
            }, 1500);
        } else {
            // Kung Desktop
            submitOrder();
        }
    } else {
        // Kung Cash on Delivery, diretso submit agad
        submitOrder();
    }
}
</script>
